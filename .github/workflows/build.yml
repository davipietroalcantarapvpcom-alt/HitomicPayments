name: Build HitomicPayments

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar plugin
        run: mvn -B clean package

      - name: Guardar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: HitomicPayments-JAR
          path: target/HitomicPayments-1.0.0.jar
